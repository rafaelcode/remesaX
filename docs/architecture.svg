<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="560" viewBox="0 0 800 560" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#555" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a1a">RemesaX — Arquitectura del MVP</text>
  <text x="400" y="50" text-anchor="middle" font-size="12" fill="#666">Plataforma de remesas LATAM sobre Stellar blockchain</text>

  <!-- Layer 1: Frontend -->
  <text x="40" y="85" font-size="14" font-weight="bold" fill="#1a1a1a">Capa de presentación</text>
  <rect x="40" y="95" width="720" height="80" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
  
  <rect x="60" y="115" width="200" height="50" rx="6" fill="#B5D4F4" stroke="#185FA5" stroke-width="1"/>
  <text x="160" y="138" text-anchor="middle" font-size="14" font-weight="bold" fill="#0C447C">Frontend</text>
  <text x="160" y="156" text-anchor="middle" font-size="11" fill="#185FA5">Blazor Server o React</text>
  
  <rect x="290" y="115" width="200" height="50" rx="6" fill="#B5D4F4" stroke="#185FA5" stroke-width="1"/>
  <text x="390" y="138" text-anchor="middle" font-size="14" font-weight="bold" fill="#0C447C">Formulario envío</text>
  <text x="390" y="156" text-anchor="middle" font-size="11" fill="#185FA5">Monto, destino, fee, ETA</text>
  
  <rect x="520" y="115" width="220" height="50" rx="6" fill="#B5D4F4" stroke="#185FA5" stroke-width="1"/>
  <text x="630" y="138" text-anchor="middle" font-size="14" font-weight="bold" fill="#0C447C">Dashboard</text>
  <text x="630" y="156" text-anchor="middle" font-size="11" fill="#185FA5">Historial y estado en vivo</text>

  <!-- Arrow Down 1 -->
  <line x1="400" y1="175" x2="400" y2="210" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="420" y="195" font-size="11" fill="#666">HTTPS / JSON</text>

  <!-- Layer 2: Backend -->
  <text x="40" y="235" font-size="14" font-weight="bold" fill="#1a1a1a">Backend .NET 8</text>
  <rect x="40" y="245" width="720" height="170" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  
  <rect x="60" y="265" width="200" height="50" rx="6" fill="#9FE1CB" stroke="#0F6E56" stroke-width="1"/>
  <text x="160" y="288" text-anchor="middle" font-size="14" font-weight="bold" fill="#085041">API REST</text>
  <text x="160" y="306" text-anchor="middle" font-size="11" fill="#0F6E56">ASP.NET Core + Swagger</text>
  
  <rect x="290" y="265" width="200" height="50" rx="6" fill="#9FE1CB" stroke="#0F6E56" stroke-width="1"/>
  <text x="390" y="288" text-anchor="middle" font-size="14" font-weight="bold" fill="#085041">RemittanceService</text>
  <text x="390" y="306" text-anchor="middle" font-size="11" fill="#0F6E56">Orquestación de negocio</text>
  
  <rect x="520" y="265" width="220" height="50" rx="6" fill="#9FE1CB" stroke="#0F6E56" stroke-width="1"/>
  <text x="630" y="288" text-anchor="middle" font-size="14" font-weight="bold" fill="#085041">StellarService</text>
  <text x="630" y="306" text-anchor="middle" font-size="11" fill="#0F6E56">Adapter stellar-dotnet-sdk</text>
  
  <rect x="60" y="335" width="320" height="60" rx="6" fill="#9FE1CB" stroke="#0F6E56" stroke-width="1"/>
  <text x="220" y="358" text-anchor="middle" font-size="14" font-weight="bold" fill="#085041">SQLite / PostgreSQL</text>
  <text x="220" y="376" text-anchor="middle" font-size="11" fill="#0F6E56">EF Core 8 · Persistencia off-chain</text>
  <text x="220" y="389" text-anchor="middle" font-size="11" fill="#0F6E56">(usuarios, transacciones, auditoría)</text>
  
  <rect x="410" y="335" width="330" height="60" rx="6" fill="#9FE1CB" stroke="#0F6E56" stroke-width="1"/>
  <text x="575" y="358" text-anchor="middle" font-size="14" font-weight="bold" fill="#085041">Servicio FX (mock)</text>
  <text x="575" y="376" text-anchor="middle" font-size="11" fill="#0F6E56">Tasas USDX → MXN, ARS, COP, PEN, BRL</text>
  <text x="575" y="389" text-anchor="middle" font-size="11" fill="#0F6E56">Reemplazable por proveedor real</text>

  <!-- Arrow Down 2 -->
  <line x1="630" y1="315" x2="630" y2="460" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="650" y="395" font-size="11" fill="#666">Horizon API</text>

  <!-- Layer 3: Stellar -->
  <text x="40" y="445" font-size="14" font-weight="bold" fill="#1a1a1a">Red Stellar (testnet)</text>
  <rect x="40" y="455" width="720" height="90" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
  
  <rect x="60" y="475" width="200" height="60" rx="6" fill="#CECBF6" stroke="#534AB7" stroke-width="1"/>
  <text x="160" y="498" text-anchor="middle" font-size="14" font-weight="bold" fill="#3C3489">Wallet emisor</text>
  <text x="160" y="514" text-anchor="middle" font-size="11" fill="#534AB7">Cuenta Stellar</text>
  <text x="160" y="528" text-anchor="middle" font-size="11" fill="#534AB7">Emite USDX (USD simulado)</text>
  
  <rect x="290" y="475" width="200" height="60" rx="6" fill="#CECBF6" stroke="#534AB7" stroke-width="1"/>
  <text x="390" y="498" text-anchor="middle" font-size="14" font-weight="bold" fill="#3C3489">Red Stellar</text>
  <text x="390" y="514" text-anchor="middle" font-size="11" fill="#534AB7">Horizon · 3-5s finality</text>
  <text x="390" y="528" text-anchor="middle" font-size="11" fill="#534AB7">Fee: ~$0.00001</text>
  
  <rect x="520" y="475" width="220" height="60" rx="6" fill="#CECBF6" stroke="#534AB7" stroke-width="1"/>
  <text x="630" y="498" text-anchor="middle" font-size="14" font-weight="bold" fill="#3C3489">Wallet receptor</text>
  <text x="630" y="514" text-anchor="middle" font-size="11" fill="#534AB7">Cuenta beneficiario LATAM</text>
  <text x="630" y="528" text-anchor="middle" font-size="11" fill="#534AB7">Recibe USDX vía trustline</text>
</svg>
