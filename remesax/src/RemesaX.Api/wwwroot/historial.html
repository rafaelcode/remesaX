<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Historial — RemesaX</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <nav class="nav">
    <div class="nav-brand">
      <span class="logo">💸</span>
      <span class="brand-name">RemesaX</span>
    </div>
    <div class="nav-links">
      <a href="/index.html">Inicio</a>
      <a href="/enviar.html">Enviar</a>
      <a href="/historial.html" class="active">Historial</a>
      <a href="/swagger" target="_blank">API Docs</a>
    </div>
  </nav>

  <main class="dashboard-page">
    <header class="dashboard-header">
      <div>
        <h1>Historial de remesas</h1>
        <p>Últimas 20 transacciones procesadas por la plataforma.</p>
      </div>
      <button id="btn-refresh" class="btn btn-ghost">↻ Refrescar</button>
    </header>

    <!-- KPIs -->
    <div class="kpis" id="kpis">
      <div class="kpi-card">
        <div class="kpi-label">Total remesas</div>
        <div class="kpi-value" id="kpi-total">—</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Volumen USDX</div>
        <div class="kpi-value" id="kpi-volume">—</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Exitosas</div>
        <div class="kpi-value success" id="kpi-success">—</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Fallidas</div>
        <div class="kpi-value danger" id="kpi-failed">—</div>
      </div>
    </div>

    <!-- Tabla -->
    <div class="table-container">
      <table class="table">
        <thead>
          <tr>
            <th>Fecha</th>
            <th>Remitente</th>
            <th>Destino</th>
            <th>Monto</th>
            <th>Convertido</th>
            <th>Estado</th>
            <th>Tx</th>
          </tr>
        </thead>
        <tbody id="remittances-body">
          <tr><td colspan="7" class="loading">Cargando...</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <script src="/js/app.js"></script>
  <script src="/js/historial.js"></script>
</body>
</html>
